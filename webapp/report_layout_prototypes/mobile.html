<meta charset="utf-8">
<title>TEG Edition — Mobile Patterns</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,500&family=Source+Serif+4:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<style>
  /* =========================================================================
     MOBILE PATTERNS.
     Stacking the desktop grid vertically recreates the single long scroll the
     edition was built to replace, so these are three different structures
     rather than three sets of breakpoints. Same T1 element vocabulary as
     composite.html; same edition data.
       A  index first     — front screen is masthead, results and headlines;
                            an article is its own screen.
       B  swipeable cards — one article per horizontal panel, kicker tabs
                            across the top carrying the affordance.
       C  accordion       — every headline visible, bodies collapsed, the lead
                            open by default, expanding in place.
     ========================================================================= */
  :root{
    --desk:#E7E5DE; --desk-edge:#D3D0C6;
    --chrome-bg:#F4F3EF; --chrome-border:#D8D6CE; --chrome-ink:#23231F;
    --chrome-ink-soft:#6B6A62; --chrome-accent:#2F5D8A;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--desk); color:var(--chrome-ink); font-family:'Libre Franklin',Arial,sans-serif; }
  h1,h2,h3,h4,h5,p,ul,ol,figure,table{ margin:0; padding:0; }
  ul{ list-style:none; }
  table{ border-collapse:collapse; }
  button{ font:inherit; color:inherit; }
  :focus-visible{ outline:2.5px solid var(--chrome-accent); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce){ *{ scroll-behavior:auto !important; transition:none !important; } }

  /* ---------- prototype chrome ------------------------------------------- */
  .control-bar{ position:sticky; top:0; z-index:30; display:flex; flex-wrap:wrap; align-items:center;
    gap:1.4rem; padding:0.75rem 1.2rem; background:var(--chrome-bg); border-bottom:1px solid var(--chrome-border); }
  .control-brand{ font-weight:800; font-size:0.76rem; letter-spacing:0.06em; text-transform:uppercase; }
  .control-brand span{ color:var(--chrome-ink-soft); font-weight:500; text-transform:none; letter-spacing:0; }
  .control-group{ display:flex; align-items:center; gap:0.45rem; flex-wrap:wrap; }
  .control-label{ font-size:0.64rem; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:var(--chrome-ink-soft); }
  .control-btn{ appearance:none; border:1px solid var(--chrome-border); background:#fff; font-size:0.76rem;
    font-weight:600; padding:0.35rem 0.68rem; border-radius:5px; cursor:pointer; line-height:1.1; }
  .control-btn[aria-pressed="true"]{ background:var(--chrome-accent); border-color:var(--chrome-accent); color:#F4F3EF; }
  .control-spacer{ flex:1 1 auto; }
  .control-note{ font-size:0.71rem; color:var(--chrome-ink-soft); max-width:40ch; line-height:1.35; }
  .metric{ font-size:0.71rem; color:var(--chrome-ink-soft); font-variant-numeric:tabular-nums; }
  .metric b{ color:var(--chrome-ink); }

  /* ---------- the phone --------------------------------------------------- */
  .phone-wrap{ display:flex; justify-content:center; padding:2rem 1rem 3.5rem; }
  .phone{
    width:390px; flex:none; position:relative;
    height:844px; overflow:hidden;
    border:1px solid var(--desk-edge); border-radius:24px;
    box-shadow:0 1px 2px rgba(0,0,0,0.08), 0 20px 44px -22px rgba(0,0,0,0.45);
    background:var(--paper);
  }
  /* capture mode: let the whole screen render so a screenshot shows all of it */
  body.capture .phone{ height:auto; overflow:visible; border-radius:0; }
  body.capture .scroller{ height:auto !important; overflow:visible !important; }
  body.capture .panel{ height:auto !important; min-height:0 !important; overflow:visible !important; }

  /* on an actual phone, drop the frame and run full bleed */
  @media (max-width:700px), (max-height:520px){
    .phone-wrap{ padding:0; }
    .phone{
      width:100%; max-width:680px; margin-inline:auto;
      height:auto; border:none; border-radius:0; box-shadow:none;
    }
    .scroller{ height:auto; overflow:visible; }
    .control-note, .metric{ display:none; }
  }

  /* ---------- T1 tokens, mobile-tuned ------------------------------------- */
  .phone{
    --paper:#F6F3EA; --ink:#211D17; --ink-soft:#66604F; --accent:#7A2420; --rule:#C9C2AC; --tint:#EDE8D9;
    --font-display:'Fraunces',Georgia,serif;
    --font-body:'Source Serif 4',Georgia,serif;
    --font-mono:'IBM Plex Mono','Courier New',monospace;
    --pad:1.15rem;
    color:var(--ink);
    background-image: radial-gradient(rgba(33,29,23,0.05) 0.55px, transparent 0.55px);
    background-size:3.4px 3.4px;
  }
  .scroller{ height:100%; overflow-y:auto; -webkit-overflow-scrolling:touch; }

  .m-masthead{ padding:0.95rem var(--pad) 0; }
  .m-mh-row{ display:flex; align-items:baseline; justify-content:space-between; gap:0.6rem; }
  .m-wordmark{ font-family:var(--font-display); font-weight:600; font-size:1.18rem; letter-spacing:0.02em; }
  .m-dateline{ font-family:var(--font-mono); font-size:0.58rem; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-soft); }
  .m-mh-rule{ border-top:3px solid var(--ink); border-bottom:1px solid var(--ink); height:4px; margin-top:0.6rem; }

  .kicker{ font-family:var(--font-mono); font-weight:700; font-size:0.63rem; letter-spacing:0.13em;
    text-transform:uppercase; color:var(--accent); }
  .m-hl{ font-family:var(--font-display); font-weight:700; line-height:1.09; color:var(--ink); text-wrap:balance; }
  .m-sf{ font-family:var(--font-body); font-style:italic; color:var(--ink-soft); line-height:1.4; }
  .m-body p{ font-family:var(--font-body); font-size:1rem; line-height:1.6; color:var(--ink); }
  .m-body p + p{ margin-top:0.8em; }
  .m-meta{ font-family:var(--font-mono); font-size:0.6rem; letter-spacing:0.09em; text-transform:uppercase; color:var(--ink-soft); }

  /* results scorecard (R5), mobile */
  .m-r5{ border:1px solid var(--ink); margin:0.95rem var(--pad) 0; }
  .m-r5-title{ background:var(--ink); color:var(--paper); font-family:var(--font-mono); font-size:0.58rem;
    font-weight:700; letter-spacing:0.16em; text-transform:uppercase; padding:0.34rem 0.7rem; }
  .m-r-list{ padding:0.5rem 0.7rem 0.6rem; display:flex; flex-direction:column; gap:0.28rem; }
  .m-r-item{ display:flex; justify-content:space-between; gap:0.7rem; align-items:baseline; }
  .m-r-label{ font-family:var(--font-mono); font-size:0.62rem; letter-spacing:0.04em; text-transform:uppercase; color:var(--ink-soft); }
  .m-r-value{ font-family:var(--font-mono); font-size:0.75rem; font-weight:600; font-variant-numeric:tabular-nums; text-align:right; }
  .m-r-vals{ display:flex; flex-direction:column; align-items:flex-end; gap:0.05rem; }
  .m-r-runner{ font-family:var(--font-mono); font-size:0.58rem; color:var(--ink-soft); text-align:right; }
  .m-r-lead{ background:var(--tint); padding:0.26rem 0.35rem; margin:0 -0.35rem; }
  .m-r-lead .m-r-value{ color:var(--accent); font-weight:700; }
</style>
<style>
  /* =========================================================================
     A — INDEX FIRST
     ========================================================================= */
  .pat-a .idx-lead{ padding:1.1rem var(--pad) 0; }
  .pat-a .idx-lead .m-hl{ font-size:1.72rem; margin-top:0.3rem; }
  .pat-a .idx-lead .m-sf{ font-size:0.94rem; margin-top:0.5rem; }
  .pat-a .idx-list{ margin-top:1.3rem; border-top:3px solid var(--ink); }
  .pat-a .idx-h{ font-family:var(--font-mono); font-size:0.6rem; font-weight:700; letter-spacing:0.16em;
    text-transform:uppercase; color:var(--ink-soft); padding:0.6rem var(--pad) 0.2rem; }
  .pat-a .idx-item{
    display:block; width:100%; text-align:left; background:none; border:none;
    border-top:1px solid var(--rule); padding:0.85rem var(--pad); cursor:pointer;
  }
  .pat-a .idx-item:first-of-type{ border-top:none; }
  .pat-a .idx-item .m-hl{ font-size:1.14rem; margin-top:0.25rem; }
  .pat-a .idx-item .idx-foot{ display:flex; justify-content:space-between; align-items:baseline;
    gap:0.6rem; margin-top:0.45rem; }
  .pat-a .chev{ font-family:var(--font-mono); font-size:0.72rem; font-weight:600;
    letter-spacing:0.04em; color:var(--accent); }
  .pat-a .idx-item.is-lead{ background:var(--tint); }

  .pat-a .topbar{
    position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:0.55rem;
    padding:0.7rem var(--pad); background:var(--paper); border-bottom:1px solid var(--ink);
  }
  .pat-a .topbar button{ background:none; border:none; cursor:pointer; display:flex; align-items:center;
    gap:0.4rem; font-family:var(--font-mono); font-size:0.66rem; font-weight:700; letter-spacing:0.1em;
    text-transform:uppercase; color:var(--accent); padding:0; }
  .pat-a .topbar .tb-title{ margin-left:auto; font-family:var(--font-mono); font-size:0.6rem;
    letter-spacing:0.09em; text-transform:uppercase; color:var(--ink-soft); }
  .pat-a .article{ padding:1.15rem var(--pad) 1.6rem; }
  .pat-a .article .m-hl{ font-size:1.55rem; margin-top:0.3rem; }
  .pat-a .article .m-sf{ font-size:0.92rem; margin-top:0.5rem; }
  .pat-a .article .m-body{ margin-top:1rem; }
  .pat-a .artnav{ display:flex; border-top:3px solid var(--ink); }
  .pat-a .artnav button{ flex:1; background:none; border:none; border-left:1px solid var(--rule);
    padding:0.9rem var(--pad); text-align:left; cursor:pointer; }
  .pat-a .artnav button:first-child{ border-left:none; }
  .pat-a .artnav button:disabled{ opacity:0.35; cursor:default; }
  .pat-a .artnav .an-lab{ font-family:var(--font-mono); font-size:0.58rem; letter-spacing:0.12em;
    text-transform:uppercase; color:var(--ink-soft); }
  .pat-a .artnav .an-hl{ font-family:var(--font-display); font-weight:700; font-size:0.88rem;
    line-height:1.2; margin-top:0.25rem; }

  /* =========================================================================
     B — SWIPEABLE CARDS
     ========================================================================= */
  .pat-b .tabs{
    position:sticky; top:0; z-index:5; display:flex; gap:0; overflow-x:auto; scrollbar-width:none;
    background:var(--paper); border-bottom:1px solid var(--ink);
  }
  .pat-b .tabs::-webkit-scrollbar{ display:none; }
  .pat-b .tab{
    flex:none; background:none; border:none; border-bottom:3px solid transparent; cursor:pointer;
    padding:0.6rem 0.75rem 0.5rem; font-family:var(--font-mono); font-size:0.6rem; font-weight:700;
    letter-spacing:0.11em; text-transform:uppercase; color:var(--ink-soft); white-space:nowrap;
  }
  .pat-b .tab[aria-selected="true"]{ color:var(--accent); border-bottom-color:var(--accent); }
  .pat-b .track{
    display:flex; overflow-x:auto; scroll-snap-type:x mandatory; height:100%;
    scrollbar-width:none;
  }
  .pat-b .track::-webkit-scrollbar{ display:none; }
  .pat-b .panel{
    flex:0 0 92%; scroll-snap-align:center; height:100%; overflow-y:auto;
    border-right:1px solid var(--rule); padding:1.05rem var(--pad) 2rem;
  }
  body.capture .pat-b .track{ display:block; overflow:visible; }
  body.capture .pat-b .panel{ width:100%; border-right:none; border-bottom:1px dashed var(--rule); }
  .pat-b .panel .m-hl{ font-size:1.5rem; margin-top:0.3rem; }
  .pat-b .panel .m-sf{ font-size:0.9rem; margin-top:0.45rem; }
  .pat-b .panel .m-body{ margin-top:0.9rem; }
  .pat-b .panel-foot{ margin-top:1.4rem; padding-top:0.7rem; border-top:1px solid var(--rule);
    display:flex; justify-content:space-between; align-items:baseline; gap:0.6rem; }
  .pat-b .swipe-hint{ font-family:var(--font-mono); font-size:0.6rem; letter-spacing:0.1em;
    text-transform:uppercase; color:var(--accent); }
  .pat-b .dots{ display:flex; gap:0.3rem; justify-content:center; padding:0.5rem 0 0.6rem;
    border-top:1px solid var(--rule); background:var(--paper); }
  .pat-b .dot{ width:6px; height:6px; border-radius:50%; background:var(--rule); }
  .pat-b .dot.on{ background:var(--accent); }

  /* =========================================================================
     C — ACCORDION
     ========================================================================= */
  .pat-c .acc-lead{ padding:1.1rem var(--pad) 1.4rem; }
  .pat-c .acc-lead .m-hl{ font-size:1.68rem; margin-top:0.3rem; }
  .pat-c .acc-lead .m-sf{ font-size:0.93rem; margin-top:0.5rem; }
  .pat-c .acc-lead .m-body{ margin-top:1rem; }
  .pat-c .acc-list{ border-top:3px solid var(--ink); }
  .pat-c .acc-row{ border-bottom:1px solid var(--rule); }
  .pat-c .acc-btn{
    display:block; width:100%; text-align:left; background:none; border:none; cursor:pointer;
    padding:0.85rem var(--pad);
  }
  .pat-c .acc-btn .m-hl{ font-size:1.12rem; margin-top:0.25rem; }
  .pat-c .acc-foot{ display:flex; justify-content:space-between; align-items:baseline; gap:0.6rem; margin-top:0.45rem; }
  .pat-c .acc-sign{ font-family:var(--font-mono); font-size:0.8rem; font-weight:700; color:var(--accent); }
  .pat-c .acc-panel{ padding:0 var(--pad) 1.2rem; }
  .pat-c .acc-panel .m-sf{ font-size:0.88rem; margin-bottom:0.75rem; }
  .pat-c .acc-row.open{ background:var(--tint); }
  .pat-c .acc-row.open .acc-btn{ padding-bottom:0.5rem; }

  /* ---------- appendix, shared across the three patterns ------------------ */
  .m-apx{ border-top:3px solid var(--ink); }
  .m-apx-btn{ display:block; width:100%; text-align:left; background:none; border:none; cursor:pointer;
    padding:0.85rem var(--pad); display:flex; justify-content:space-between; align-items:center; gap:0.6rem; }
  .m-apx-h{ font-family:var(--font-mono); font-size:0.63rem; font-weight:700; letter-spacing:0.12em;
    text-transform:uppercase; color:var(--accent); }
  .m-apx-body{ padding:0 var(--pad) 1.5rem; }
  .m-apx-sec + .m-apx-sec{ margin-top:1.2rem; }
  .table-scroll{ overflow-x:auto; max-width:100%; }
  .stab{ width:100%; }
  .stab th,.stab td{ text-align:left; padding:0.32rem 0.6rem 0.32rem 0; font-family:var(--font-mono);
    font-size:0.68rem; white-space:nowrap; border-bottom:1px solid var(--rule); font-variant-numeric:tabular-nums; }
  .stab th{ font-weight:700; font-size:0.58rem; letter-spacing:0.05em; text-transform:uppercase; color:var(--ink-soft); }
  .recs-cat{ font-family:var(--font-body); font-weight:700; font-size:0.8rem; margin-bottom:0.3rem; }
  .recs li{ font-family:var(--font-body); font-size:0.86rem; color:var(--ink-soft); position:relative;
    padding-left:0.9rem; line-height:1.45; }
  .recs li + li{ margin-top:0.3rem; }
  .recs li::before{ content:"—"; position:absolute; left:0; color:var(--accent); }
  .recs-group + .recs-group{ margin-top:0.9rem; }
  /* ---------- shippable-quality additions -------------------------------- */

  /* Touch targets. Every tappable row is at least 44px tall and takes the
     whole width, so nothing needs aiming at. */
  .idx-item, .acc-btn, .m-apx-btn, .tab, .topbar button, .artnav button{
    min-height:44px; -webkit-tap-highlight-color:transparent;
  }
  .idx-item:active, .acc-btn:active, .m-apx-btn:active{ background:var(--tint); }
  .phone :focus-visible{ outline:2.5px solid var(--accent); outline-offset:-2px; }

  /* Real phones: fill the viewport, respect the notch and the home indicator. */
  @media (max-width:700px), (max-height:520px){
    .phone.pat-b{
      display:flex; flex-direction:column; overflow:hidden;
      height:calc(100dvh - var(--chrome-h, 0px));
    }
    .pat-b .track{ flex:1 1 auto; min-height:0; height:auto; }
    .pat-b .panel{ height:100%; padding-bottom:calc(2rem + env(safe-area-inset-bottom)); }
    .pat-b .m-masthead, .pat-b .tabs, .pat-b .dots{ flex:none; }
    .m-masthead{ padding-top:calc(0.95rem + env(safe-area-inset-top)); }
    .pat-a .topbar{ padding-top:calc(0.7rem + env(safe-area-inset-top)); }
    .pat-a .artnav{ padding-bottom:env(safe-area-inset-bottom); }
  }

  /* A: the lead is the hero and the hero is the tap target — it used to also
     appear as the first row of the list, which read as a duplicate. */
  .pat-a .idx-lead{
    display:block; width:100%; text-align:left; background:none; border:none;
    padding:1.1rem var(--pad) 1.2rem; cursor:pointer; border-bottom:3px solid var(--ink);
  }
  .pat-a .idx-lead:active{ background:var(--tint); }
  .pat-a .idx-lead .lead-cta{
    display:flex; justify-content:space-between; align-items:baseline; gap:0.6rem; margin-top:0.7rem;
  }
  .pat-a .idx-list{ margin-top:0; border-top:none; }

  /* B: the active tab is scrolled into view, and the panel edge is visible so
     there is always something to swipe towards. */
  .pat-b .tab{ scroll-margin-inline:1rem; }
  .pat-b .panel:last-child{ border-right:none; }
  .pat-b .kbd-hint{
    font-family:var(--font-mono); font-size:0.58rem; letter-spacing:0.08em;
    text-transform:uppercase; color:var(--ink-soft);
  }

  /* Deep-linking means a screen can be entered cold; give the heading focus
     without showing a ring for pointer users. */
  .phone [tabindex="-1"]:focus{ outline:none; }
</style>

<div class="control-bar" role="toolbar" aria-label="Prototype controls">

  <p class="control-note" id="patNote"></p>
</div>

  function readTime(words){ return Math.max(1, Math.ceil(words / 200)) + " min read"; }

  function edition(){ return editionsByTeg[state.teg]; }
  function leadOf(e){ return e.articles.filter(function(a){ return a.is_lead; })[0]; }
  function subsOf(e){ return e.articles.filter(function(a){ return !a.is_lead; }); }

  /* ---- shared atoms ------------------------------------------------------ */

  function mastheadHtml(e){
    var d = e.dateline;
    return '<header class="m-masthead"><div class="m-mh-row">' +
      '<span class="m-wordmark">The TEG</span>' +
      '<span class="m-dateline">' + esc(d.teg) + ' &middot; ' + esc(d.venue) + ' &middot; ' + esc(d.year) + '</span>' +
      '</div><div class="m-mh-rule"></div></header>';
  }
  function resultsHtml(e, flush){
    var items = e.results.map(function(r){
      return '<li class="m-r-item' + (r.lead ? " m-r-lead" : "") + '">' +
        '<span class="m-r-label">' + esc(r.label) + '</span>' +
        '<span class="m-r-vals"><span class="m-r-value">' + esc(r.value) + '</span>' +
        (r.runner_up ? '<span class="m-r-runner">' + esc(r.runner_up) + '</span>' : '') +
        '</span></li>';
    }).join("");
    return '<div class="m-r5"' + (flush ? ' style="margin:0"' : '') + '>' +
      '<p class="m-r5-title">At a glance</p>' +
      '<ul class="m-r-list">' + items + '</ul></div>';
  }
  function appendixHtml(e, open){
    var rows = e.standings.map(function(s){
      return '<tr><td>R' + s.round + '</td><td>' + esc(s.trophy) + '</td><td>' + esc(s.jacket) + '</td></tr>';
    }).join("");
    var by = {}, order = [];
    e.records.forEach(function(r){
      if (!by[r.category]){ by[r.category] = []; order.push(r.category); }
      by[r.category].push(r.text);
    });
    var recs = order.map(function(c){
      return '<div class="recs-group"><p class="recs-cat">' + esc(c) + '</p><ul class="recs">' +
        by[c].map(function(t){ return "<li>" + esc(t) + "</li>"; }).join("") + '</ul></div>';
    }).join("");
    var body = open
      ? '<div class="m-apx-body" id="apx-body">' +
          '<div class="m-apx-sec"><div class="table-scroll"><table class="stab">' +
            '<thead><tr><th>Rd</th><th>Trophy</th><th>Green Jacket</th></tr></thead>' +
            '<tbody>' + rows + '</tbody></table></div></div>' +
          '<div class="m-apx-sec">' + recs + '</div>' +
        '</div>'
      : "";
    return '<section class="m-apx">' +
      '<button type="button" class="m-apx-btn" data-apx="1" aria-expanded="' + (open ? "true" : "false") +
        '" aria-controls="apx-body">' +
        '<span class="m-apx-h">Standings &amp; records</span>' +
        '<span class="acc-sign" aria-hidden="true">' + (open ? "−" : "+") + '</span>' +
      '</button>' + body + '</section>';
  }

  /* ---- A · index first ---------------------------------------------------- */

  function renderIndexA(e, lead, subs){
    // The lead is the hero and the hero is the tap target. It used to also be
    // the first row of the list below, which read as the same story twice.
    var items = subs.map(function(a, i){
      return '<button type="button" class="idx-item" data-open="' + (i + 1) + '">' +
        '<p class="kicker">' + esc(a.kicker) + '</p>' +
        '<h2 class="m-hl">' + esc(a.headline) + '</h2>' +
        '<span class="idx-foot"><span class="m-meta">' + readTime(a.words) + '</span>' +
        '<span class="chev" aria-hidden="true">Read &rarr;</span></span></button>';
    }).join("");

    return '<div class="scroller" id="scroller">' +
      mastheadHtml(e) + resultsHtml(e) +
      '<button type="button" class="idx-lead" data-open="0">' +
        '<p class="kicker">' + esc(lead.kicker) + '</p>' +
        '<h1 class="m-hl">' + esc(lead.headline) + '</h1>' +
        (lead.standfirst ? '<p class="m-sf">' + esc(lead.standfirst) + '</p>' : '') +
        '<span class="lead-cta"><span class="m-meta">' + readTime(lead.words) + '</span>' +
        '<span class="chev" aria-hidden="true">Read the report &rarr;</span></span>' +
      '</button>' +
      '<nav class="idx-list" aria-label="In this edition">' +
        '<p class="idx-h">Also in this edition</p>' + items +
      '</nav>' +
      appendixHtml(e, state.apxOpen) +
    '</div>';
  }

  function renderArticleA(e, all, i){
    var a = all[i], prev = all[i - 1], next = all[i + 1];
    function navBtn(art, j, label){
      if (!art) return '<button type="button" disabled><span class="an-lab">' + label + '</span></button>';
      return '<button type="button" data-open="' + j + '"><span class="an-lab">' + label + '</span>' +
        '<span class="an-hl">' + esc(art.headline) + '</span></button>';
    }
    return '<div class="scroller" id="scroller">' +
      '<div class="topbar"><button type="button" data-index="1">&larr; Front page</button>' +
        '<span class="tb-title">' + esc(e.dateline.teg) + '</span></div>' +
      '<article class="article">' +
        '<p class="kicker">' + esc(a.kicker) + '</p>' +
        '<h1 class="m-hl" id="screen-title" tabindex="-1">' + esc(a.headline) + '</h1>' +
        (a.standfirst ? '<p class="m-sf">' + esc(a.standfirst) + '</p>' : '') +
        '<div class="m-body">' + paragraphsHtml(a.paragraphs) + '</div>' +
      '</article>' +
      '<nav class="artnav" aria-label="Other articles">' +
        navBtn(prev, i - 1, "Previous") + navBtn(next, i + 1, "Next") + '</nav>' +
    '</div>';
  }

  /* ---- B · swipeable cards ------------------------------------------------ */

  function renderB(e, lead, subs){
    var all = [lead].concat(subs);
    var labels = all.map(function(a){ return a.kicker; }).concat(["Standings"]);

    var tabs = labels.map(function(label, i){
      return '<button type="button" class="tab" role="tab" id="tab-' + i + '" data-panel="' + i + '" ' +
        'aria-controls="panel-' + i + '" aria-selected="' + (i === state.panel) + '" ' +
        'tabindex="' + (i === state.panel ? "0" : "-1") + '">' + esc(label) + '</button>';
    }).join("");

    var panels = all.map(function(a, i){
      var isLead = i === 0;
      return '<section class="panel" role="tabpanel" id="panel-' + i + '" aria-labelledby="tab-' + i + '" ' +
        'data-panel-index="' + i + '" tabindex="0">' +
        (isLead ? resultsHtml(e, true) : "") +
        '<p class="kicker"' + (isLead ? ' style="margin-top:0.95rem"' : '') + '>' + esc(a.kicker) + '</p>' +
        '<h1 class="m-hl">' + esc(a.headline) + '</h1>' +
        (a.standfirst ? '<p class="m-sf">' + esc(a.standfirst) + '</p>' : '') +
        '<div class="m-body">' + paragraphsHtml(a.paragraphs) + '</div>' +
        '<div class="panel-foot"><span class="m-meta">' + (i + 1) + ' of ' + (all.length + 1) + '</span>' +
        '<span class="swipe-hint" aria-hidden="true">Swipe &rarr;</span></div>' +
      '</section>';
    }).join("");

    var apxIndex = all.length;
    var apxPanel = '<section class="panel" role="tabpanel" id="panel-' + apxIndex + '" ' +
      'aria-labelledby="tab-' + apxIndex + '" data-panel-index="' + apxIndex + '" tabindex="0">' +
      '<p class="kicker">Reference</p><h1 class="m-hl">Standings &amp; records</h1>' +
      appendixHtml(e, true)
        .replace('<section class="m-apx">', '<div style="margin-top:1rem">')
        .replace(/<button type="button" class="m-apx-btn"[\s\S]*?<\/button>/, "")
        .replace('</section>', '</div>') +
      '<div class="panel-foot"><span class="m-meta">' + (apxIndex + 1) + ' of ' + (apxIndex + 1) + '</span>' +
      '<span class="kbd-hint" aria-hidden="true">&larr; back</span></div>' +
      '</section>';

    var dots = labels.map(function(_, i){
      return '<span class="dot' + (i === state.panel ? " on" : "") + '"></span>';
    }).join("");

    return mastheadHtml(e) +
      '<div class="tabs" role="tablist" aria-label="Articles">' + tabs + '</div>' +
      '<div class="track" id="track">' + panels + apxPanel + '</div>' +
      '<div class="dots" aria-hidden="true">' + dots + '</div>';
  }

  /* ---- C · accordion (prototype only, kept as the record) ----------------- */

  function renderC(e, lead, subs){
    var rows = subs.map(function(a, i){
      var open = !!state.open[i];
      return '<div class="acc-row' + (open ? " open" : "") + '">' +
        '<button type="button" class="acc-btn" data-acc="' + i + '" aria-expanded="' + open +
          '" aria-controls="acc-panel-' + i + '">' +
          '<p class="kicker">' + esc(a.kicker) + '</p>' +
          '<h2 class="m-hl">' + esc(a.headline) + '</h2>' +
          '<span class="acc-foot"><span class="m-meta">' + readTime(a.words) + '</span>' +
          '<span class="acc-sign" aria-hidden="true">' + (open ? "−" : "+") + '</span></span>' +
        '</button>' +
        (open ? '<div class="acc-panel" id="acc-panel-' + i + '">' +
            (a.standfirst ? '<p class="m-sf">' + esc(a.standfirst) + '</p>' : '') +
            '<div class="m-body">' + paragraphsHtml(a.paragraphs) + '</div></div>' : '') +
      '</div>';
    }).join("");

    return '<div class="scroller" id="scroller">' +
      mastheadHtml(e) + resultsHtml(e) +
      '<article class="acc-lead">' +
        '<p class="kicker">' + esc(lead.kicker) + '</p>' +
        '<h1 class="m-hl">' + esc(lead.headline) + '</h1>' +
        (lead.standfirst ? '<p class="m-sf">' + esc(lead.standfirst) + '</p>' : '') +
        '<div class="m-body">' + paragraphsHtml(lead.paragraphs) + '</div>' +
      '</article>' +
      '<div class="acc-list">' + rows + '</div>' +
      appendixHtml(e, state.apxOpen) +
    '</div>';
  }

  /* ---- routing ------------------------------------------------------------
     The phone's Back gesture is the most-used control on a phone, so each
     screen is a history entry. Hash form: #a/14, #a/14/story/2, #b/14/panel/3.
     ------------------------------------------------------------------------- */

  function toHash(){
    var h = "#" + state.pat + "/" + state.teg;
    if (state.pat === "a" && state.view !== null) h += "/story/" + state.view;
    if (state.pat === "b" && state.panel) h += "/panel/" + state.panel;
    return h;
  }

  function fromHash(){
    var parts = (location.hash || "").replace(/^#/, "").split("/").filter(Boolean);
    if (!parts.length) return false;
    var pat = parts[0], teg = parseInt(parts[1], 10);
    if (["a", "b", "c"].indexOf(pat) === -1 || !editionsByTeg[teg]) return false;
    state.pat = pat;
    state.teg = teg;
    state.view = null;
    state.panel = 0;
    if (parts[2] === "story") state.view = parseInt(parts[3], 10) || 0;
    if (parts[2] === "panel") state.panel = parseInt(parts[3], 10) || 0;
    return true;
  }

  // A sandboxed frame can refuse the history API. Routing is a convenience —
  // losing it must not take the page down with it.
  function writeHistory(h, replace){
    try {
      if (replace) history.replaceState(null, "", h);
      else history.pushState(null, "", h);
    } catch (err) {
      historyAvailable = false;
    }
  }

  function go(patch, replace){
    Object.assign(state, patch);
    var h = toHash();
    if (location.hash === h) { render(); return; }
    writeHistory(h, replace);
    render();
  }

  window.addEventListener("popstate", function(){
    if (!fromHash()) { state.view = null; state.panel = 0; }
    render();
  });

  /* ---- render -------------------------------------------------------------- */

  function render(){
    var e = edition(), lead = leadOf(e), subs = subsOf(e), all = [lead].concat(subs);
    var phone = document.getElementById("phone");

    phone.className = "phone pat-" + state.pat;
    if (state.pat === "a"){
      phone.innerHTML = state.view === null
        ? renderIndexA(e, lead, subs)
        : renderArticleA(e, all, Math.min(state.view, all.length - 1));
    } else if (state.pat === "b"){
      phone.innerHTML = renderB(e, lead, subs);
      var track = document.getElementById("track");
      if (track){
        track.addEventListener("scroll", onTrackScroll, { passive: true });
        var target = track.querySelector('[data-panel-index="' + state.panel + '"]');
        if (target) track.scrollLeft = target.offsetLeft - track.offsetLeft;
        scrollTabIntoView();
      }
    } else {
      phone.innerHTML = renderC(e, lead, subs);
    }

    bindScreen();
    restoreScroll();
    syncControls();
    reportMetric();
    document.body.setAttribute("data-ready", "1");
  }

  // Which element actually scrolls. In the desktop phone frame it is .scroller;
  // below 700px the frame is dropped and the document scrolls instead, so
  // writing scrollTop to .scroller there silently does nothing.
  function scrollHost(){
    var s = document.getElementById("scroller");
    if (s && s.scrollHeight > s.clientHeight + 1) return s;
    return document.scrollingElement || document.documentElement;
  }

  // Returning to the index should land where you left it, not at the top.
  function restoreScroll(){
    var host = scrollHost();
    var onScroll = function(){ indexScroll = host.scrollTop; };
    if (state.pat === "a" && state.view === null){
      host.scrollTop = indexScroll;
      (host === document.scrollingElement ? window : host)
        .addEventListener("scroll", onScroll, { passive: true });
    } else {
      host.scrollTop = 0;
      var h = document.getElementById("screen-title");
      if (h) h.focus({ preventScroll: true });
    }
  }

  function syncControls(){
    document.querySelectorAll("[data-teg]").forEach(function(b){
      b.setAttribute("aria-pressed", String(b.getAttribute("data-teg") === String(state.teg)));
    });
    document.querySelectorAll("[data-pat]").forEach(function(b){
      b.setAttribute("aria-pressed", String(b.getAttribute("data-pat") === state.pat));
    });
    document.getElementById("patNote").textContent = PAT_NOTES[state.pat];
  }

  // The number the whole exercise is about: a vertical stack of the desktop
  // grid is one very long scroll, and each pattern is measured against it.
  function reportMetric(){
    var el = document.getElementById("scroller") ||
             document.querySelector("#phone .track .panel") || document.getElementById("phone");
    var h = el ? Math.max(el.scrollHeight, el.getBoundingClientRect().height) : 0;
    document.getElementById("metric").innerHTML =
      "First screen: <b>" + Math.round(h) + "px</b> (" + (h / 844).toFixed(1) + " phone screens)";
  }

  /* ---- B: swipe, tabs, keyboard -------------------------------------------- */

  function onTrackScroll(){
    var track = document.getElementById("track");
    if (!track) return;
    var mid = track.scrollLeft + track.clientWidth / 2;
    var panels = track.querySelectorAll(".panel");
    for (var i = 0; i < panels.length; i++){
      var left = panels[i].offsetLeft - track.offsetLeft;
      if (mid >= left && mid < left + panels[i].offsetWidth){
        if (state.panel !== i){
          state.panel = i;
          syncTabs();
          scrollTabIntoView();
          // a swipe replaces rather than stacks, so Back leaves the edition
          writeHistory(toHash(), true);
          reportMetric();
        }
        return;
      }
    }
  }
  function syncTabs(){
    document.querySelectorAll("#phone .tab").forEach(function(b){
      var on = parseInt(b.getAttribute("data-panel"), 10) === state.panel;
      b.setAttribute("aria-selected", String(on));
      b.setAttribute("tabindex", on ? "0" : "-1");
    });
    document.querySelectorAll("#phone .dot").forEach(function(d, i){
      d.classList.toggle("on", i === state.panel);
    });
  }
  function scrollTabIntoView(){
    var tab = document.querySelector('#phone .tab[aria-selected="true"]');
    if (tab && tab.scrollIntoView) tab.scrollIntoView({ inline: "center", block: "nearest" });
  }
  function goToPanel(i){
    var track = document.getElementById("track");
    if (!track) return;
    var panels = track.querySelectorAll(".panel");
    i = Math.max(0, Math.min(panels.length - 1, i));
    var target = track.querySelector('[data-panel-index="' + i + '"]');
    if (!target) return;
    state.panel = i;
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    track.scrollTo({ left: target.offsetLeft - track.offsetLeft, behavior: reduce ? "auto" : "smooth" });
    syncTabs();
    scrollTabIntoView();
  }

  /* ---- events -------------------------------------------------------------- */

  function bindScreen(){
    document.querySelectorAll("#phone [data-open]").forEach(function(b){
      b.addEventListener("click", function(){
        go({ view: parseInt(b.getAttribute("data-open"), 10) });
      });
    });
    document.querySelectorAll("#phone [data-index]").forEach(function(b){
      b.addEventListener("click", function(){ go({ view: null }); });
    });
    document.querySelectorAll("#phone [data-acc]").forEach(function(b){
      b.addEventListener("click", function(){
        var i = b.getAttribute("data-acc");
        state.open[i] = !state.open[i];
        render();
      });
    });
    document.querySelectorAll("#phone [data-apx]").forEach(function(b){
      b.addEventListener("click", function(){ state.apxOpen = !state.apxOpen; render(); });
    });
    document.querySelectorAll("#phone .tab").forEach(function(b){
      b.addEventListener("click", function(){ goToPanel(parseInt(b.getAttribute("data-panel"), 10)); });
    });
  }

  document.addEventListener("keydown", function(ev){
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
    if (state.pat === "b"){
      if (ev.key === "ArrowRight"){ ev.preventDefault(); goToPanel(state.panel + 1); }
      if (ev.key === "ArrowLeft"){ ev.preventDefault(); goToPanel(state.panel - 1); }
    }
    if (state.pat === "a" && state.view !== null && ev.key === "Escape"){
      ev.preventDefault();
      if (historyAvailable) history.back(); else go({ view: null }, true);
    }
  });

  document.querySelectorAll("[data-teg]").forEach(function(b){
    b.addEventListener("click", function(){
      go({ teg: parseInt(b.getAttribute("data-teg"), 10), view: null, panel: 0, open: {}, apxOpen: false });
    });
  });
  document.querySelectorAll("[data-pat]").forEach(function(b){
    b.addEventListener("click", function(){
      indexScroll = 0;
      go({ pat: b.getAttribute("data-pat"), view: null, panel: 0, open: {}, apxOpen: false });
    });
  });

  // hooks the screenshot script drives
  window.__proto = {
    set: function(patch){ Object.assign(state, patch); render(); },
    panel: goToPanel
  };

  // The control bar is prototype chrome of unknown height, and pattern B needs
  // to know how much viewport is actually left for a card.
  function measureChrome(){
    var bar = document.querySelector(".control-bar");
    var h = bar ? Math.round(bar.getBoundingClientRect().height) : 0;
    document.documentElement.style.setProperty("--chrome-h", h + "px");
  }
  window.addEventListener("resize", measureChrome, { passive: true });
  window.addEventListener("orientationchange", measureChrome);
  measureChrome();

  if (!fromHash()) writeHistory(toHash(), true);
  render();
})();
</script>
