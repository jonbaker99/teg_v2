{% extends "base.html" %}

{% block page_title %}
<div class="page-title-area">
    <span class="page-label">Scoring</span>
    <h1 class="page-title">Average by TEG</h1>
</div>
{% endblock %}

{% block content %}
<p class="page-subtitle">Gross vs par by TEG and player</p>

{% if chart_json %}
<div class="chart-block section-gap" data-crowded-threshold="{{ chart_crowded_threshold }}">
<div class="data-card data-card--padded">
    <div class="chart-container" data-figure="{{ chart_json }}" style="height:350px;"></div>
</div>
{% if chart_readout %}
<div class="lr-readout" role="group" aria-label="Player values">
    {% for item in chart_readout %}
    <button type="button" class="lr-readout-entry" data-chart-focus="{{ item.name }}" aria-pressed="false" aria-label="Focus {{ item.name }}; value {{ item.value }}"><span class="lr-initials"{% if item.color %} style="color: {{ item.color }};"{% endif %}>{{ item.code }}</span><strong>{{ item.value }}</strong></button>
    {% endfor %}
</div>
{% endif %}
</div>
{% endif %}

<div class="data-card"><div class="table-wrapper scoring-byteg-page">{{ table_html | safe }}</div></div>
{% endblock %}
