<div class="tb-turn" data-question="{{ question }}"{% if answer_text %} data-answer="{{ answer_text }}"{% endif %}>
    <div class="tb-q" style="margin-left:auto; width:fit-content;">{{ question }}</div>
    <div class="tb-a" style="margin-top: 8px;">
        <div class="tb-answer">
            {% if error %}
            <p class="tb-error">{{ error }}</p>
            {% else %}
            {{ answer_html | safe }}
            {% if tool_calls %}
            <details class="tb-workings">
                <summary>Show the workings ({{ tool_calls | length }} step{{ 's' if tool_calls | length != 1 }})</summary>
                {% for c in tool_calls %}
                <div><strong>{{ c.name }}</strong></div>
                <pre>{{ c.input }}</pre>
                <pre>→ {{ c.output }}</pre>
                {% endfor %}
            </details>
            {% endif %}
            {% endif %}
        </div>
    </div>
</div>
