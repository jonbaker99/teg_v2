{% if error %}
{% include "partials/_public_response_error.html" %}
{% elif sections %}
  {% for section in sections %}
    {% if section.title %}<h2 class="section-title">{{ section.title }}</h2>{% endif %}
    <div class="data-card"><div class="table-wrapper">{{ section.table_html | safe }}</div></div>
  {% endfor %}
{% else %}
<p class="text-muted text-sm">No data available.</p>
{% endif %}
