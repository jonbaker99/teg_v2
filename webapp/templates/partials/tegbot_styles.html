<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=VT323&display=swap">
<style>
    /* TEGBot: lo-fi retro. Only three colours: paper (white, or black in dark
       mode), forest green, and the grey chat area. */
    .tb-app {
        --tb-paper: #ffffff; --tb-ink: #111111; --tb-green: #1f5c34; --tb-green-2: #2e7d46;
        --tb-grey: #ececec; --tb-grey-line: #d6d6d6;
        --tb-mono: 'IBM Plex Mono', 'Courier New', monospace; --tb-pixel: 'VT323', 'IBM Plex Mono', monospace;
        background: var(--tb-paper); color: var(--tb-ink); font-family: var(--tb-mono);
        border: 2px solid var(--tb-green); border-radius: 4px; padding: 20px; max-width: 48rem;
    }
    html[data-mode="dark"] .tb-app {
        --tb-paper: #000000; --tb-ink: #eeeeee; --tb-green: #5fb36f; --tb-green-2: #7fcf8b;
        --tb-grey: #1c1c1c; --tb-grey-line: #333333;
    }
    .tb-app a { color: var(--tb-green); text-decoration: underline; text-underline-offset: 2px; }

    /* The robot: green body, eyes and mouth cut out in paper colour. */
    .tb-bot { color: var(--tb-green); fill: currentColor; flex: none; display: block; }
    .tb-bot .tb-bot-cut { fill: var(--tb-paper); }
    .tb-bot .tb-bot-eyes { transform-box: fill-box; transform-origin: center; animation: tb-blink 5s infinite; }
    .tb-bot--busy .tb-bot-eyes { animation: tb-scan 1.2s steps(1) infinite; }
    .tb-bot--busy .tb-bot-antenna { animation: tb-flash 0.6s steps(1) infinite; }
    @keyframes tb-blink { 0%, 94%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.15); } }
    @keyframes tb-scan { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-1px); } 75% { transform: translateX(1px); } }
    @keyframes tb-flash { 50% { fill: var(--tb-paper); } }

    /* Header */
    .tb-hero { display: flex; gap: 16px; align-items: center; margin-bottom: 16px; }
    .tb-hero h2 { font-family: var(--tb-pixel); font-size: 2.6rem; line-height: 1; color: var(--tb-green); margin: 0; letter-spacing: 0.04em; }
    .tb-hero p { margin: 4px 0 0; font-size: 0.85rem; line-height: 1.45; }
    .tb-links { display: flex; flex-wrap: wrap; gap: 14px; margin: 0 0 16px; font-size: 0.85rem; }

    /* Chat */
    .tb-thread { display: flex; flex-direction: column; gap: 18px; margin-bottom: 18px; }
    .tb-thread:empty { display: none; }
    .tb-q {
        align-self: flex-end; max-width: 85%; width: fit-content; margin-left: auto;
        background: var(--tb-green); color: var(--tb-paper); padding: 7px 12px;
        border-radius: 3px; font-size: 0.88rem; overflow-wrap: anywhere;
    }
    .tb-a { display: flex; gap: 10px; align-items: flex-start; margin-top: 8px; }
    .tb-answer {
        flex: 1; min-width: 0; background: var(--tb-grey); border: 1px solid var(--tb-grey-line);
        border-radius: 3px; padding: 12px 16px; font-family: var(--tb-mono);
        font-size: 0.86rem; line-height: 1.55; color: var(--tb-ink);
    }
    .tb-answer p { margin: 0 0 0.6em; }
    .tb-answer p:last-child { margin-bottom: 0; }
    .tb-answer strong { color: var(--tb-green); }
    .tb-answer ul, .tb-answer ol { margin: 0 0 0.6em 1.2em; list-style: square; }
    .tb-answer table { border-collapse: collapse; margin: 1em 0 1.1em; font: inherit; display: block; overflow-x: auto; }
    .tb-answer th, .tb-answer td { border-bottom: 1px dashed var(--tb-grey-line); padding: 5px 14px 5px 0; text-align: left; }
    .tb-answer th { color: var(--tb-green); font-weight: 600; border-bottom-style: solid; border-bottom-color: var(--tb-green); }
    .tb-error { font-style: italic; }
    .tb-workings { margin-top: 0.6em; font-size: 0.75rem; opacity: 0.75; }
    .tb-workings summary { cursor: pointer; }
    .tb-workings pre {
        white-space: pre-wrap; overflow-wrap: anywhere; max-height: 18rem; overflow: auto;
        background: var(--tb-paper); border: 1px dashed var(--tb-grey-line); padding: 8px; margin: 6px 0;
        font-family: var(--tb-mono); font-size: 11px;
    }
    .tb-related { margin-top: 0.8em; padding-top: 0.6em; border-top: 1px dashed var(--tb-grey-line); }
    .tb-related-label { font-family: var(--tb-pixel); font-size: 1.05rem; color: var(--tb-green); text-transform: uppercase; letter-spacing: 0.06em; }
    .tb-answer .tb-related ul { margin: 2px 0 0 1.1em; }

    /* Thinking: a little terminal that ticks while TEGBot works. */
    .tb-term { flex: 1; min-width: 0; background: var(--tb-grey); border: 1px solid var(--tb-grey-line); border-radius: 3px; padding: 10px 14px; }
    .tb-term-line { font-family: var(--tb-pixel); font-size: 1.35rem; line-height: 1.15; color: var(--tb-green); }
    .tb-term-line::before { content: "> "; }
    .tb-cursor { display: inline-block; width: 0.55em; height: 0.95em; background: var(--tb-green); vertical-align: -0.1em; margin-left: 2px; animation: tb-flash-bg 0.9s steps(1) infinite; }
    @keyframes tb-flash-bg { 50% { opacity: 0; } }
    .tb-term-foot { display: flex; align-items: center; gap: 10px; margin-top: 6px; font-family: var(--tb-pixel); font-size: 1.05rem; color: var(--tb-ink); }
    .tb-blocks { display: inline-flex; gap: 3px; }
    .tb-blocks i { width: 9px; height: 9px; background: var(--tb-green); opacity: 0.15; animation: tb-march 1.4s steps(1) infinite; }
    .tb-blocks i:nth-child(2) { animation-delay: 0.14s; } .tb-blocks i:nth-child(3) { animation-delay: 0.28s; }
    .tb-blocks i:nth-child(4) { animation-delay: 0.42s; } .tb-blocks i:nth-child(5) { animation-delay: 0.56s; }
    .tb-blocks i:nth-child(6) { animation-delay: 0.70s; } .tb-blocks i:nth-child(7) { animation-delay: 0.84s; }
    .tb-blocks i:nth-child(8) { animation-delay: 0.98s; }
    @keyframes tb-march { 0%, 30% { opacity: 1; } 31%, 100% { opacity: 0.15; } }
    @media (prefers-reduced-motion: reduce) {
        .tb-bot *, .tb-cursor, .tb-blocks i { animation: none !important; }
        .tb-blocks i { opacity: 0.6; }
    }

    /* Input */
    .tb-form { display: flex; gap: 8px; align-items: stretch; }
    .tb-form textarea {
        flex: 1; min-height: 3rem; resize: vertical; padding: 9px 11px;
        border: 2px solid var(--tb-green); border-radius: 3px;
        background: var(--tb-paper); color: var(--tb-ink); font: 0.9rem/1.4 var(--tb-mono);
    }
    .tb-form textarea::placeholder { color: var(--tb-ink); opacity: 0.45; }
    .tb-form textarea:focus { outline: 2px dashed var(--tb-green); outline-offset: 2px; }
    .tb-form button {
        padding: 0 18px; border-radius: 3px; border: 2px solid var(--tb-green);
        background: var(--tb-green); color: var(--tb-paper);
        font-family: var(--tb-pixel); font-size: 1.5rem; letter-spacing: 0.06em; cursor: pointer;
    }
    .tb-form button:hover { background: var(--tb-green-2); border-color: var(--tb-green-2); }
    .tb-form button[disabled] { opacity: 0.45; cursor: default; }
    .tb-examples { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 0; }
    .tb-examples button {
        border: 1px solid var(--tb-green); background: transparent; color: var(--tb-green);
        border-radius: 3px; padding: 3px 9px; font: 0.78rem/1.4 var(--tb-mono); cursor: pointer;
    }
    .tb-examples button:hover { background: var(--tb-green); color: var(--tb-paper); }
    .tb-footnote { margin: 16px 0 0; font-size: 0.72rem; line-height: 1.5; opacity: 0.7; }

    /* What others asked */
    .tb-views { display: flex; gap: 6px; margin: 0 0 16px; }
    .tb-views a { border: 1px solid var(--tb-green); border-radius: 3px; padding: 3px 12px; font: 0.8rem var(--tb-mono); color: var(--tb-green); text-decoration: none; }
    .tb-views a[aria-current="page"] { background: var(--tb-green); color: var(--tb-paper); }
    .tb-theme { font-family: var(--tb-pixel); font-weight: 400; font-size: 1.7rem; color: var(--tb-green); margin: 24px 0 10px; }
    .tb-theme small { font-size: 0.7em; opacity: 0.7; color: var(--tb-ink); }
    .tb-conv { margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px dashed var(--tb-grey-line); }
    .tb-conv-meta { font-size: 0.72rem; opacity: 0.6; margin-bottom: 6px; }
    .tb-conv details.tb-past > summary { cursor: pointer; list-style: none; }
    .tb-conv details.tb-past > summary::-webkit-details-marker { display: none; }
    .tb-conv details.tb-past > summary .tb-q { margin-left: 0; }
    .tb-conv .tb-past + .tb-past { margin-top: 10px; }
    .tb-past.tb-hit > summary .tb-q { outline: 3px dashed var(--tb-green-2); outline-offset: 2px; }
    @media (max-width: 480px) {
        .tb-app { padding: 14px; }
        .tb-hero h2 { font-size: 2.1rem; }
        .tb-a > .tb-bot { width: 22px; height: 19px; }
        .tb-answer { padding: 10px 12px; }
        .tb-answer table { font-size: 0.76rem; }
        .tb-answer th, .tb-answer td { padding-right: 10px; }
    }
</style>
